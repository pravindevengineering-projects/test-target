name: AI PR Review
on:
  pull_request:

jobs:
  ai-review:
    uses: pravindevengineering-projects/ai-judge/.github/workflows/ai-review.yml@v1
    permissions:
      contents: read
      pull-requests: write
    with:
      reviewer-repo: pravindevengineering-projects/ai-judge
      reviewer-ref: v1
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
